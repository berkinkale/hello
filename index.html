<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA AI</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    linear-gradient(135deg,#020024,#090979,#00d4ff);
    color:white;
}


/* hareketli ışıklar */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00ffff;
    filter:blur(150px);
    opacity:.25;
    animation:move 8s infinite alternate;
}


@keyframes move{
    from{
        transform:translate(-200px,-100px);
    }
    to{
        transform:translate(200px,100px);
    }
}



.container{

position:relative;
z-index:2;

width:95%;
max-width:450px;

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(20px);

border-radius:30px;

padding:20px;

border:1px solid rgba(255,255,255,.2);

box-shadow:
0 0 40px rgba(0,255,255,.6);

}



.logo{

text-align:center;

font-size:38px;

font-weight:bold;

color:#00ffff;

text-shadow:
0 0 20px cyan;

}



.subtitle{

text-align:center;

color:#00ff99;

margin-bottom:15px;

}



.chat{

height:350px;

overflow-y:auto;

background:
rgba(0,0,0,.35);

border-radius:20px;

padding:15px;

}



.message{

padding:12px;

margin:10px 0;

border-radius:15px;

}



.ai{

background:
rgba(0,255,150,.12);

color:#00ff99;

}



.user{

background:
rgba(0,200,255,.15);

color:#00ffff;

text-align:right;

}



.area{

display:flex;

margin-top:15px;

}



input{

flex:1;

padding:14px;

border-radius:15px;

border:none;

outline:none;

background:#050505;

color:white;

}



.send{

margin-left:10px;

padding:14px 20px;

border-radius:15px;

border:none;

background:#00ffff;

font-size:18px;

cursor:pointer;

}



.buttons{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-top:15px;

}



button{

padding:12px;

border-radius:15px;

border:none;

background:#111;

color:white;

cursor:pointer;

}



button:hover{

background:#00ffff;

color:black;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">
🌌 NOVA AI
</div>


<div class="subtitle">
🤖 Akıllı asistan aktif
</div>


<div class="chat" id="chat">

<div class="message ai">
Nova: Merhaba Berkin 👋<br>
Ben NOVA AI. Hazırım.
</div>

</div>


<div class="area">

<input 
id="input"
placeholder="Nova'ya bir şey sor..."
>

<button class="send" onclick="send()">
➤
</button>

</div>


<div class="buttons">

<button onclick="quick('yardım')">
🧠 Yardım
</button>

<button onclick="quick('saat')">
🕒 Saat
</button>

<button onclick="quick('matematik')">
🧮 Matematik
</button>

<button onclick="quick('bilgi')">
🌍 Bilgi
</button>

</div>
<script>

function addMessage(text,type){

let chat=document.getElementById("chat");

chat.innerHTML +=
`
<div class="message ${type}">
${text}
</div>
`;

chat.scrollTop=chat.scrollHeight;

}



function thinking(text){

let chat=document.getElementById("chat");

let wait=document.createElement("div");

wait.className="message ai";

wait.innerHTML="Nova: düşünüyor... 🤖";

chat.appendChild(wait);


setTimeout(()=>{

wait.innerHTML="Nova: "+text;

},600);


}




function send(){


let input=document.getElementById("input");

let soru=input.value.trim();


if(soru=="") return;



addMessage(
"Sen: "+soru,
"user"
);



let mesaj=soru.toLowerCase();


let cevap="Bunu henüz bilmiyorum.";



// SELAMLAŞMA

if(
mesaj.includes("selam") ||
mesaj.includes("merhaba")
){

cevap="Selam Berkin 👋 NOVA burada. Sana nasıl yardımcı olabilirim?";

}



// NASILSIN

else if(
mesaj.includes("naber") ||
mesaj.includes("nasılsın")
){

cevap="İyiyim 😄 Sistemlerim aktif çalışıyor.";

}



// TEŞEKKÜR

else if(
mesaj.includes("teşekkür") ||
mesaj.includes("sağol")
){

cevap="Rica ederim Berkin 😊";

}



// KİMLİK

else if(
mesaj.includes("ben kimim")
){

cevap="Sen Berkin'sin. NOVA AI kullanıcısısın.";

}



// YAŞ

else if(
mesaj.includes("kaç yaşındasın")
){

cevap="Benim yaşım yok. Ben bir yapay zekâ asistanıyım.";

}



// MATEMATİK

else if(
/[0-9]/.test(mesaj) &&
(
mesaj.includes("+") ||
mesaj.includes("-") ||
mesaj.includes("*") ||
mesaj.includes("x") ||
mesaj.includes("/")
)
){

try{

let islem=
mesaj.replaceAll("x","*");


cevap=
"Sonuç: "+
eval(islem);


}

catch{

cevap="Bu matematik işlemini anlayamadım.";

}

}



// YARDIM

else if(
mesaj.includes("yardım")
){

cevap=
`
Yapabildiklerim:<br>
💬 Sohbet<br>
🧮 Matematik<br>
🌍 Bilgi<br>
🕒 Saat<br>
<script>


// EK BİLGİ MOTORU

let eskiSend = send;


send = function(){


let input=document.getElementById("input");

let soru=input.value.toLowerCase();



let cevaplar = {

"türkiye":
"Türkiye'nin başkenti Ankara'dır. Türkiye 7 bölgeden oluşur.",

"istanbul":
"İstanbul, Türkiye'nin en kalabalık şehridir.",

"ankara":
"Ankara, Türkiye'nin başkentidir.",

"mars":
"Mars, kızıl gezegen olarak bilinir.",

"uzay":
"Uzay, Dünya atmosferinin dışındaki sonsuz boşluktur.",

"güneş":
"Güneş, Dünya'ya enerji veren bir yıldızdır.",

"ay":
"Ay, Dünya'nın doğal uydusudur.",

"dünya":
"Dünya, yaşam olduğu bilinen tek gezegendir.",

"yapay zeka":
"Yapay zeka, bilgisayarların öğrenme ve karar verme yeteneğidir.",

"bilgisayar":
"Bilgisayar, verileri işleyen elektronik cihazdır.",

"telefon":
"Telefon, iletişim kurmayı sağlayan teknolojik cihazdır.",

"internet":
"İnternet, dünya çapında bağlantı sağlayan büyük ağdır.",

"html":
"HTML, web sayfalarının temel yapısını oluşturur.",

"css":
"CSS, web sayfalarının görünümünü düzenler.",

"javascript":
"JavaScript, web sitelerine hareket ve özellik ekler.",

"python":
"Python, popüler bir programlama dilidir.",

"robot":
"Robot, programlanabilen mekanik sistemdir.",

"elektrik":
"Elektrik, enerji taşıyan fiziksel bir olaydır.",

"su":
"Su, yaşam için gerekli temel maddelerden biridir.",

"hayvan":
"Hayvanlar canlı organizmalardır.",

"fenerbahçe":
"Fenerbahçe, İstanbul merkezli bir spor kulübüdür.",

"galatasaray":
"Galatasaray, Türkiye'nin önemli spor kulüplerinden biridir.",

"müzik":
"Müzik, seslerin düzenli birleşimiyle oluşan sanattır."

};



for(let kelime in cevaplar){

if(soru.includes(kelime)){

addMessage(
"Nova: "+cevaplar[kelime],
"ai"
);

input.value="";

return;

}

}


// yukarıdakiler yoksa normal sisteme gönder

eskiSend();


}


</script>
<script>


// KONUM SİSTEMİ

function konumAl(){

if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(

function(position){


addMessage(
"Nova: Konum izni verildi ✅<br>"+
"Enlem: "+
position.coords.latitude+
"<br>Boylam: "+
position.coords.longitude,
"ai"
);


},


function(){

addMessage(
"Nova: Konum izni reddedildi ❌",
"ai"
);

}


);


}

else{

addMessage(
"Nova: Cihaz konum özelliğini desteklemiyor.",
"ai"
);

}

}





// KONUM BUTONU EKLE

let buttons=document.querySelector(".buttons");


let konumButon=document.createElement("button");

konumButon.innerHTML="📍 Konum";


konumButon.onclick=function(){

konumAl();

};


buttons.appendChild(konumButon);





// EK KOMUTLAR


let eskiQuick=quick;


quick=function(text){


if(text=="bilgi"){

document.getElementById("input").value="yardım";

}

else{

document.getElementById("input").value=text;

}


send();


}



</script>


</body>
</html>
