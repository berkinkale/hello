<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkin'in Sitesi</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
transition:0.2s;
}

h1{
color:white;
font-size:60px;
text-align:center;
animation:buyu 1s infinite alternate;
text-shadow:0 0 20px red;
}

@keyframes buyu{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

.flash{
animation:flash .2s infinite;
}

@keyframes flash{
0%{background:black;}
50%{background:darkred;}
100%{background:black;}
}

.shake{
animation:shake .08s infinite;
}

@keyframes shake{
0%{transform:translate(2px,2px);}
25%{transform:translate(-2px,-2px);}
50%{transform:translate(2px,-2px);}
75%{transform:translate(-2px,2px);}
100%{transform:translate(2px,-2px);}
}

.confetti{
position:absolute;
width:10px;
height:10px;
top:-20px;
animation:fall linear forwards;



}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<h1 id="yazi">😂 BERKİN TARAFINDAN TROLLENDİNİZ 😂</h1>

<script>

function confetti(){
for(let i=0;i<250;i++){
let d=document.createElement("div");
d.className="confetti";
d.style.left=Math.random()*100+"vw";
d.style.background="hsl("+Math.random()*360+",100%,50%)";
d.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(d);
setTimeout(()=>d.remove(),5000);
}
}

setTimeout(()=>{
document.body.classList.add("flash");
document.body.classList.add("shake");
confetti();
},3000);

</script>

</body>
</html>
