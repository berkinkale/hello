<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkin</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:black;
overflow:hidden;
font-family:Arial;
color:white;
transition:.2s;
}

h1{
font-size:60px;
text-align:center;
text-shadow:0 0 20px red;
animation:zoom 1s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

.flash{
animation:flash .2s infinite;
}

@keyframes flash{
0%{background:black;}
50%{background:darkred;}
100%{background:black;}
}

.shake{
animation:shake .08s infinite;
}

@keyframes shake{
0%{transform:translate(2px,2px);}
25%{transform:translate(-2px,-2px);}
50%{transform:translate(3px,-2px);}
75%{transform:translate(-3px,2px);}
100%{transform:translate(2px,-2px);}
}
</style>

</head>
<body>

<h1 id="text">
😂 BERKİN TARAFINDAN TROLLENDİNİZ 😂
</h1>

<audio id="mehter" preload="auto" loop>
<source src="mehter.mp3" type="audio/mpeg">
</audio>

<script>

const audio=document.getElementById("mehter");

setTimeout(()=>{
document.body.classList.add("flash");
document.body.classList.add("shake");

audio.play().catch(()=>{
document.getElementById("text").innerHTML=
"🎵 Müziği başlatmak için ekrana dokun.<br><br>😂 BERKİN TARAFINDAN TROLLENDİNİZ 😂";
});
},3000);

document.body.addEventListener("click",()=>{
audio.play();
},{once:true});

</script>

</body>
</html>
