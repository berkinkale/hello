<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA AI</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:
linear-gradient(135deg,#020024,#090979,#00d4ff);

color:white;

}



/* hareketli ışık */

body::before{

content:"";

position:absolute;

width:600px;

height:600px;

background:#00ffff;

filter:blur(160px);

opacity:.25;

animation:glow 8s infinite alternate;

}



@keyframes glow{

from{

transform:translate(-200px,-150px);

}


to{

transform:translate(200px,150px);

}

}




.container{


position:relative;

z-index:2;


width:95%;

max-width:450px;


height:650px;


background:

rgba(255,255,255,0.10);


backdrop-filter:blur(20px);


border:

1px solid rgba(255,255,255,.25);


border-radius:30px;


padding:20px;


box-shadow:

0 0 40px rgba(0,255,255,.5);


}




.logo{


text-align:center;


font-size:40px;


font-weight:bold;


color:#00ffff;


text-shadow:

0 0 20px cyan;


}



.status{


text-align:center;


margin:10px;


color:#00ff99;


}




.chat{


height:430px;


overflow-y:auto;


padding:15px;


background:

rgba(0,0,0,.35);


border-radius:20px;


}




.message{


padding:12px;


margin:10px 0;


border-radius:15px;


line-height:1.4;


}



.ai{


background:

rgba(0,255,150,.12);


color:#00ff99;


}



.user{


background:

rgba(0,200,255,.15);


color:#00ffff;


text-align:right;


}




.input-area{


display:flex;


margin-top:15px;


}



input{


flex:1;


padding:14px;


border:none;


outline:none;


border-radius:15px;


background:#050505;


color:white;


font-size:15px;


}



.send{


margin-left:10px;


padding:14px 20px;


border:none;


border-radius:15px;


background:#00ffff;


cursor:pointer;


font-size:18px;


}



.send:hover{


transform:scale(1.05);


box-shadow:0 0 20px cyan;


}



</style>


</head>



<body>



<div class="container">



<div class="logo">

🌌 NOVA AI

</div>



<div class="status">

🤖 Yapay zeka sistemi hazır

</div>



<div class="chat" id="chat">


<div class="message ai">

Nova: Merhaba Berkin 👋<br>
Yeni nesil asistan sistemi başlatıldı.

</div>


</div>



<div class="input-area">


<input id="input" placeholder="Nova'ya mesaj yaz...">


<button class="send" onclick="send()">

➤

</button>


</div>



</div>
<script>


function addMessage(text,type){

let chat=document.getElementById("chat");

chat.innerHTML +=

`
<div class="message ${type}">
${text}
</div>
`;

chat.scrollTop=chat.scrollHeight;

}



function thinking(text){

let chat=document.getElementById("chat");

let loading=document.createElement("div");

loading.className="message ai";

loading.innerHTML="Nova: düşünüyor... 🤖";

chat.appendChild(loading);


setTimeout(()=>{

loading.innerHTML="Nova: "+text;

},700);


}




function send(){


let input=document.getElementById("input");

let soru=input.value.trim();


if(!soru) return;



addMessage(
"Sen: "+soru,
"user"
);



let mesaj=soru.toLowerCase();



let cevap="Bunu anlamaya çalışıyorum.";




if(
mesaj.includes("selam") ||
mesaj.includes("merhaba")
){

cevap=
"Merhaba Berkin 👋 Ben NOVA AI. Sana nasıl yardımcı olabilirim?";

}



else if(
mesaj.includes("naber") ||
mesaj.includes("nasılsın")
){

cevap=
"İyiyim 😄 Sistemlerim aktif ve çalışmaya hazırım.";

}



else if(
mesaj.includes("teşekkür") ||
mesaj.includes("sağol")
){

cevap=
"Rica ederim Berkin 😊";

}



else if(
mesaj.includes("yardım")
){

cevap=
"Şu anda sohbet, matematik ve bilgi özelliklerimi kullanabilirsin.";

}



else if(
mesaj.includes("sen kimsin")
||
mesaj.includes("nesin")
){

cevap=
"Ben NOVA AI. Sana yardımcı olmak için tasarlanmış bir yapay zeka asistanıyım.";

}



thinking(cevap);



input.value="";


}




document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

send();

}

});


</script>
<script>


let eskiSend = send;


send = function(){


let input=document.getElementById("input");

let soru=input.value.toLowerCase();



/* MATEMATİK MOTORU */


if(
/[0-9]/.test(soru) &&
(
soru.includes("+") ||
soru.includes("-") ||
soru.includes("*") ||
soru.includes("/") ||
soru.includes("x")
)

){

try{


let islem=soru.replaceAll("x","*");


addMessage(
"Sen: "+input.value,
"user"
);


addMessage(
"Nova: Sonuç = "+eval(islem),
"ai"
);


input.value="";

return;


}

catch{

addMessage(
"Nova: Bu işlemi çözemiyorum.",
"ai"
);

input.value="";

return;

}


}




/* BİLGİ MOTORU */


let bilgiler={


"türkiye":
"Türkiye'nin başkenti Ankara'dır. Türkiye Asya ve Avrupa arasında yer alır.",


"istanbul":
"İstanbul, Türkiye'nin en kalabalık şehridir.",


"mars":
"Mars, kızıl gezegen olarak bilinen gezegendir.",


"uzay":
"Uzay, gezegenler, yıldızlar ve galaksilerden oluşan büyük boşluktur.",


"güneş":
"Güneş, Dünya'ya enerji sağlayan bir yıldızdır.",


"ay":
"Ay, Dünya'nın doğal uydusudur.",


"yapay zeka":
"Yapay zeka, bilgisayarların öğrenmesini ve karar vermesini sağlayan teknolojidir.",


"bilgisayar":
"Bilgisayar, bilgileri işleyen elektronik bir cihazdır.",


"html":
"HTML, internet sitelerinin temel yapısını oluşturur.",


"css":
"CSS, internet sitelerinin tasarımını düzenler.",


"javascript":
"JavaScript, web sitelerine hareket ve özellik ekleyen programlama dilidir.",


"python":
"Python, kolay öğrenilen ve çok kullanılan bir programlama dilidir.",


"robot":
"Robotlar, programlanabilen makineleridir."


};



for(let kelime in bilgiler){


if(soru.includes(kelime)){


addMessage(
"Sen: "+input.value,
"user"
);


addMessage(
"Nova: "+bilgiler[kelime],
"ai"
);


input.value="";

return;


}


}


// hiçbir şey bulamazsa normal sisteme dön

eskiSend();


}


</script>
<script>


// KONUM SİSTEMİ


function konumAl(){


if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(

function(position){


addMessage(
"Nova: Konum izni verildi ✅<br>"+
"Enlem: "+
position.coords.latitude+
"<br>Boylam: "+
position.coords.longitude,
"ai"
);


},


function(){


addMessage(
"Nova: Konum izni reddedildi ❌",
"ai"
);


}

);


}

else{


addMessage(
"Nova: Cihazında konum desteği yok.",
"ai"
);


}


}





// HAVA DURUMU KOMUTU


let eskiSend2=send;


send=function(){


let input=document.getElementById("input");

let soru=input.value.toLowerCase();



if(soru.includes("hava")){


addMessage(
"Sen: "+input.value,
"user"
);


addMessage(
"Nova: Hava durumu için konum bilgisi gerekiyor. 📍 Önce konum izni vermelisin.",
"ai"
);


input.value="";

return;


}




// GÖRSEL AI KOMUTU


if(
soru.includes("görsel") ||
soru.includes("resim") ||
soru.includes("fotoğraf")
){


addMessage(
"Sen: "+input.value,
"user"
);


addMessage(
"Nova: Görsel oluşturma sistemi hazırlanıyor 🎨",
"ai"
);


input.value="";

return;


}



eskiSend2();


}




// BUTONLAR EKLEME


let alan=document.querySelector(".container");


let yeniButonlar=document.createElement("div");


yeniButonlar.innerHTML=

`

<br>

<button onclick="konumAl()" 
style="
width:100%;
padding:12px;
border-radius:15px;
border:none;
background:#111;
color:white;
cursor:pointer;">
📍 Konum İzni
</button>

`;



alan.appendChild(yeniButonlar);



</script>
<script>


// HIZLI KOMUTLAR


document.addEventListener(
"keydown",
function(e){


if(e.key==="Escape"){


addMessage(
"Nova: Sohbet temizleme özelliği yakında.",
"ai"
);


}


});





// BAŞLANGIÇ ANİMASYONU


window.onload=function(){


let chat=document.getElementById("chat");


setTimeout(()=>{


addMessage(
"Nova: Sistem kontrolü tamamlandı ✅",
"ai"
);


},1000);



};





// KÜÇÜK MOBİL DÜZENLEME


if(window.innerWidth < 500){


document.querySelector(".container").style.height="95vh";


}





</script>


</body>

</html>
